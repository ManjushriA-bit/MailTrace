<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#071116"/><rect x="0" y="0" width="250" height="820" fill="#0b171d"/><text x="32" y="55" fill="#e8f3f6" font-size="28" font-family="Arial" font-weight="700">MailTrace</text><text x="32" y="82" fill="#6e8791" font-size="12" font-family="Arial">SIH26106 · SOC</text><g fill="#9db3bb" font-family="Arial" font-size="16"><text x="32" y="145">▦ Dashboard</text><text x="32" y="190">⌕ Email Analysis</text><text x="32" y="235">▣ Investigations</text><text x="32" y="280">◈ Threat Intelligence</text><text x="32" y="325">⌘ Threat Graph</text><text x="32" y="370">◎ Geolocation</text><text x="32" y="415">▤ Reports</text><text x="32" y="460">⚙ Settings</text></g><rect x="285" y="32" width="1080" height="70" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="315" y="61" fill="#79a7b5" font-size="11" font-family="Arial">AI-POWERED EMAIL THREAT DETECTION</text><text x="315" y="88" fill="#edf7f9" font-size="24" font-family="Arial" font-weight="700">Security Operations Dashboard</text><rect x="285" y="130" width="330" height="150" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="307" y="164" fill="#7895a0" font-size="11" font-family="Arial">INVESTIGATIONS</text><text x="307" y="198" fill="#dcebee" font-size="34" font-family="Arial">12</text><text x="307" y="250" fill="#dcebee" font-size="13" font-family="Arial">Total investigations</text><text x="307" y="281" fill="#dcebee" font-size="13" font-family="Arial">8 high-risk cases</text><rect x="640" y="130" width="330" height="150" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="662" y="164" fill="#7895a0" font-size="11" font-family="Arial">RISK</text><text x="662" y="198" fill="#dcebee" font-size="34" font-family="Arial">87 / 100</text><text x="662" y="250" fill="#dcebee" font-size="15" font-family="Arial">CRITICAL</text><text x="662" y="283" fill="#dcebee" font-size="13" font-family="Arial">Phishing + impersonation signals</text><rect x="995" y="130" width="370" height="150" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="1017" y="164" fill="#7895a0" font-size="11" font-family="Arial">ENGINE</text><text x="1017" y="198" fill="#dcebee" font-size="22" font-family="Arial">LOCAL ENGINE READY</text><text x="1017" y="238" fill="#dcebee" font-size="13" font-family="Arial">Defensive analysis only</text><rect x="285" y="305" width="1080" height="210" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="307" y="339" fill="#7895a0" font-size="11" font-family="Arial">INVESTIGATION PIPELINE</text><text x="307" y="373" fill="#dcebee" font-size="17" font-family="Arial">1. Upload .eml → 2. Parse headers → 3. Authenticate → 4. Score risk</text><text x="307" y="408" fill="#dcebee" font-size="17" font-family="Arial">5. Extract indicators → 6. Correlate → 7. Report</text><text x="307" y="443" fill="#dcebee" font-size="13" font-family="Arial">Demo mode keeps analysis local and does not open links or execute attachments.</text><rect x="285" y="540" width="520" height="210" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="307" y="574" fill="#7895a0" font-size="11" font-family="Arial">DEMO EMAIL</text><text x="307" y="608" fill="#dcebee" font-size="18" font-family="Arial">security@micros0ft-support.com</text><text x="307" y="644" fill="#dcebee" font-size="14" font-family="Arial">Subject: URGENT: Verify your Microsoft account</text><text x="307" y="676" fill="#dcebee" font-size="13" font-family="Arial">Indicators: 203.0.113.42 · suspicious domain · URL · attachment</text><rect x="835" y="540" width="530" height="210" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="857" y="574" fill="#7895a0" font-size="11" font-family="Arial">DECISION</text><text x="857" y="608" fill="#dcebee" font-size="22" font-family="Arial">CRITICAL — investigate before trusting</text><text x="857" y="648" fill="#dcebee" font-size="13" font-family="Arial">Reasons: authentication failures, domain mismatch, urgency, suspicious URL</text><text x="857" y="679" fill="#dcebee" font-size="13" font-family="Arial">Recommended: quarantine and verify through an independent channel.</text></svg>