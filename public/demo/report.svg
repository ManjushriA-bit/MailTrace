ont-size="15" font-family="Arial">09:14 — headers, IPs, domains, URLs and attachment metadata extracted</text><text x="307" y="459" fill="#dcebee" font-size="15" font-family="Arial">09:15 — SPF/DKIM/DMARC evidence parsed</text><text x="307" y="492" fill="#dcebee" font-size="15" font-family="Arial">09:15 — explainable threat score generated</text><rect x="285" y="550" width="1080" height="160" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="307" y="584" fill="#7895a0" font-size="11" font-family="Arial">RECOMMENDED ACTION</text><text x="307" y="618" fill="#dcebee" font-size="17" font-family="Arial">Quarantine · preserve original .eml · verify sender independently · investigate linked indicators</text><text x="307" y="653" fill="#dcebee" font-size="13" font-family="Arial">Report is print-ready for analyst handoff and can include notes/findings.</text></svg>