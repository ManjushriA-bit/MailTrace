<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><rect width="1400" height="820" fill="#071116"/><rect width="250" height="820" fill="#0b171d"/><text x="32" y="55" fill="#e8f3f6" font-size="28" font-family="Arial" font-weight="700">MailTrace</text><text x="32" y="82" fill="#6e8791" font-size="12" font-family="Arial">SIH26106 · SOC</text><g fill="#9db3bb" font-family="Arial" font-size="16"><text x="32" y="145">▦ Dashboard</text><text x="32" y="190">⌕ Email Analysis</text><text x="32" y="235">▣ Investigations</text><text x="32" y="280">◈ Threat Intelligence</text><text x="32" y="325">⌘ Threat Graph</text><text x="32" y="370">◎ Geolocation</text><text x="32" y="415">▤ Reports</text><text x="32" y="460">⚙ Settings</text></g><rect x="285" y="32" width="1080" height="70" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="315" y="61" fill="#79a7b5" font-size="11" font-family="Arial">AI-POWERED EMAIL THREAT DETECTION</text><text x="315" y="88" fill="#edf7f9" font-size="24" font-family="Arial" font-weight="700">Email Threat Analysis — Demo Phishing Case</text><rect x="285" y="130" width="520" height="260" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="307" y="164" fill="#7895a0" font-size="11" font-family="Arial">THREAT ASSESSMENT</text><text x="307" y="218" fill="#dcebee" font-size="64" font-family="Arial">87</text><text x="307" y="280" fill="#dcebee" font-size="14" font-family="Arial">RISK / 100</text><text x="307" y="312" fill="#ff8290" font-size="20" font-family="Arial" font-weight="700">CRITICAL</text><text x="307" y="350" fill="#dcebee" font-size="13" font-family="Arial">DEMO DATA</text><rect x="835" y="130" width="530" height="260" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="857" y="164" fill="#7895a0" font-size="11" font-family="Arial">EMAIL IDENTITY</text><text x="857" y="198" fill="#dcebee" font-size="15" font-family="Arial">Sender  security@micros0ft-support.com</text><text x="857" y="231" fill="#dcebee" font-size="15" font-family="Arial">Reply-To  account-review@secure-m365-alerts.com</text><text x="857" y="264" fill="#dcebee" font-size="15" font-family="Arial">Recipient  analyst@example.com</text><text x="857" y="297" fill="#dcebee" font-size="15" font-family="Arial">Subject  URGENT: Verify your Microsoft account</text><rect x="285" y="420" width="520" height="300" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="307" y="454" fill="#7895a0" font-size="11" font-family="Arial">EXPLAINABLE REASONS</text><text x="307" y="488" fill="#dcebee" font-size="17" font-family="Arial">SPF: FAIL</text><text x="307" y="523" fill="#dcebee" font-size="17" font-family="Arial">DKIM: FAIL</text><text x="307" y="558" fill="#dcebee" font-size="17" font-family="Arial">DMARC: FAIL</text><text x="307" y="593" fill="#dcebee" font-size="17" font-family="Arial">Reply-To / sender-domain mismatch</text><text x="307" y="628" fill="#dcebee" font-size="17" font-family="Arial">Urgent credential-verification language</text><rect x="835" y="420" width="530" height="300" rx="12" fill="#0d1b22" stroke="#1b323b"/><text x="857" y="454" fill="#7895a0" font-size="11" font-family="Arial">RECOMMENDED ACTION</text><text x="857" y="488" fill="#dcebee" font-size="19" font-family="Arial">Quarantine for analyst review.</text><text x="857" y="525" fill="#dcebee" font-size="15" font-family="Arial">Do not open the attachment or follow the URL.</text><text x="857" y="558" fill="#dcebee" font-size="15" font-family="Arial">Verify the sender through a trusted channel.</text><text x="857" y="591" fill="#dcebee" font-size="15" font-family="Arial">Preserve headers and indicators for investigation.</text></svg>